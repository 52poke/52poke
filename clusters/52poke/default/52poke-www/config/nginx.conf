worker_processes  auto;

events {
  worker_connections  1024;
}
http {
  include       mime.types;
  default_type  application/octet-stream;
  set_real_ip_from 10.0.0.0/8;
  client_max_body_size 16M;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    root /var/www/html;
    server_name _;

    # Content Security Policy: block externally hosted scripts while keeping
    # WordPress (front-end + wp-admin) working.
    #
    # Notes, all verified against the running WordPress tree:
    # * 'unsafe-inline'/'unsafe-eval' are required: core emits inline <script>,
    #   and underscore/colorpicker/tinymce use new Function()/eval().
    # * script-src-attr is deliberately NOT set to 'none': wp-admin emits
    #   onclick= attributes in 14+ files (media modal, delete confirmations,
    #   comment reply), so blocking handler attributes would break admin.
    # * blob: is used for media previews and Gutenberg upload workers.
    # * s.w.org serves the emoji images, gravatar serves admin/comment avatars.
    # * Cloudflare Web Analytics is injected by the edge: the beacon script is on
    #   static.cloudflareinsights.com and it POSTs to cloudflareinsights.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://media.52poke.com https://*.52poke.com https://s.w.org https://secure.gravatar.com https://*.gravatar.com; font-src 'self' data:; media-src 'self' blob: https://media.52poke.com; connect-src 'self' https://cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; child-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
      index index.html index.htm index.php;
      try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param REQUEST_METHOD $request_method;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass 127.0.0.1:9000;
    }
  }
}
