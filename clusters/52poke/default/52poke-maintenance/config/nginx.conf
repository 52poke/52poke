server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "3600" always;
  error_page 404 503 =503 /index.html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /index.html {
    internal;
  }

  location / {
    return 503;
  }
}
