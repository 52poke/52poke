apiVersion: apps/v1
kind: Deployment
metadata:
  name: 52poke-maintenance
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 52poke-maintenance
  template:
    metadata:
      labels:
        app: 52poke-maintenance
    spec:
      containers:
      - name: nginx
        image: nginx:1.26
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: 52poke-maintenance
          items:
          - key: index.html
            path: index.html
      - name: nginx-config
        configMap:
          name: 52poke-maintenance
          items:
          - key: nginx.conf
            path: default.conf
