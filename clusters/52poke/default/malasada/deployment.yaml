apiVersion: apps/v1
kind: Deployment
metadata:
  name: malasada
  namespace: default
spec:
  selector:
    matchLabels:
      app: malasada
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: malasada
    spec:
      containers:
      - env:
        - name: PORT
          value: "3000"
        - name: S3_BUCKET
          value: media-52poke-com
        - name: S3_ENDPOINT
          value: https://hel1.your-objectstorage.com
        - name: S3_REGION
          value: hel1
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: hetzner-object-storage
              key: accessKeyID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hetzner-object-storage
              key: secretAccessKey
        image: ghcr.io/52poke/malasada:latest
        imagePullPolicy: Always
        name: malasada
        ports:
        - containerPort: 3000
          name: malasada
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
